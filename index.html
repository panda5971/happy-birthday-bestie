<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Daniyal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background">
  <img
    src="background-left.jpg"
    class="background-photo"
    alt=""
  >
</div>

  <div class="background">
    <img
      src="background-left.jpg"
      class="background-photo"
      alt=""
    >
  </div>

  <main class="page">

    <h1>
      🎂 <span>HaPpY BirthDaY</span> <strong>Daniyal</strong> 🎂
    </h1>

    <div class="heart-frame">

      <svg
        id="heartSvg"
        viewBox="0 0 500 510"
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs id="defs"></defs>
        <g id="textHeart"></g>
      </svg>

      <div class="center-name">
        <strong>Crime</strong>
        <strong>Partner💗</strong>
      </div>

    </div>

  </main>

  <audio id="birthdayMusic" loop preload="auto">
    <source src="birthday-song.mp3" type="audio/mpeg">
  </audio>

  <button id="musicBtn">
    🎵 Play Music
  </button>

  <script src="script.js"></script>

</body>
</html>
